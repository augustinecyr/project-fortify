name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API tests (unit + integration)
    runs-on: ubuntu-latest

    # Postgres service the integration suite connects to. Credentials and the
    # database name must match api/tests/integration/conftest.py (TEST_DB_URL),
    # which hardcodes fortify_user:fortify_pass@localhost:5432/fortify_test.
    services:
      postgres:
        # Same major version as docker-compose.yml (postgres:15-alpine) so CI
        # tests against what actually runs.
        image: postgres:15
        env:
          POSTGRES_USER: fortify_user
          POSTGRES_PASSWORD: fortify_pass
          POSTGRES_DB: fortify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fortify_user -d fortify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (anomaly detection + scoring)
        working-directory: api
        run: pytest tests/test_anomaly_detection.py tests/test_scoring.py -v

      - name: Integration tests (API + auth + RBAC + audit)
        working-directory: api
        # Redis is patched to no-ops in conftest, so no Redis service is needed.
        run: pytest tests/integration -v --cov=app --cov-report=term-missing
