# DEPRECATED as of v0.8.0 — use docker-compose.yml at the project root instead.
# This file is kept for reference only.

services:
  postgres:
    image: postgres:15-alpine
    container_name: fortify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fortify}
      POSTGRES_USER: ${POSTGRES_USER:-fortify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fortify_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortify_user -d fortify"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fortify-network

  redis:
    image: redis:7-alpine
    container_name: fortify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fortify-network

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: fortify-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fortify_user}:${POSTGRES_PASSWORD:-fortify_pass}@postgres:5432/${POSTGRES_DB:-fortify}
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-dev-api-key-12345}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ../api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - fortify-network

volumes:
  postgres_data:
  redis_data:

networks:
  fortify-network:
    driver: bridge
